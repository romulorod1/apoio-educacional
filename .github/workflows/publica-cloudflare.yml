# Publica o aplicativo no endereco proprio, https://apoio-educacional.pages.dev (B4).
#
# SO DEPOIS DO PORTAO INTEIRO VERDE NA MAIN. Este workflow nao tem push nem
# pull_request: ele acorda quando o workflow "portao" termina (workflow_run) e
# so publica se aquela rodada foi
#   - de um push (nunca de PR: o PR roda o portao sobre o commit de merge, que
#     nao e o que esta na main),
#   - na main, do proprio repositorio (nunca de fork),
#   - com conclusao success, que no push na main quer dizer portao-rapido,
#     as oito fatias do navegador e o portao-navegador verdes, ou as fatias puladas
#     de proposito pelo portao-arvore (nivel 3, abaixo; veja o portao.yml).
# Portao vermelho, cancelado ou pulado: este job nem comeca.
#
# NIVEL 3 DA POLITICA DE TESTES (09/11/2026): no push da main o portao so roda a
# bateria inteira quando a arvore (tree) do commit difere da cabeca do PR cuja
# bateria passou (job portao-arvore). Aqui o passo "bateria" refaz essa conta
# com a mesma _teste/arvore_da_main.js, pelo gh api com o GITHUB_TOKEN, e diz no
# log qual caminho tomou e por que:
#   - tree IGUAL ao da cabeca de um PR com a bateria inteira verde: publica sem
#     rodar a bateria de novo (o portao pulou as fatias);
#   - tree DIFERENTE (ou sem PR, ou API fora do ar): a bateria tem de ter rodado,
#     e o passo confere, na rodada do portao que acordou este workflow, que o
#     job portao-navegador terminou "success". Se nao, nao publica.
#
# E SO SE AQUELE COMMIT AINDA E A PONTA DA MAIN. Dois pushes seguidos: o portao
# do segundo cancela o do primeiro (concurrency do portao), mas se o primeiro
# terminar depois do segundo, publicar o primeiro levaria o site para tras. O
# passo "ponta" compara o commit do portao com a main de agora e, se ela ja
# andou, nao publica: quem publica e o portao do commit mais novo.
#
# Publicacao por envio direto (wrangler pages deploy), com o token e o id da
# conta nos secrets do repositorio. A integracao Git da Cloudflare com o GitHub
# nao e usada: assim quem decide o que sobe e o portao, e nao a Cloudflare.
# Sobe a pasta montada pelo .github/monta_site.sh, sem _teste/ nem os
# geradores da biblioteca.
#
# Depois de publicar, a conferencia-no-ar confere o endereco novo contra o
# mesmo commit, como ja conferia o GitHub Pages.
name: publica-cloudflare

on:
  workflow_run:
    workflows: [portao]
    types: [completed]
    branches: [main]

# Uma publicacao por vez, sem cancelar a que esta no meio: cancelar um envio
# pela metade pode deixar o Pages sem a versao nova e sem dizer por que.
concurrency:
  group: publica-cloudflare
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  publica:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publicou: ${{ steps.envio.outputs.publicou }}
      # o veredito do passo "ponta" (portao verde e commit na ponta da main), que o
      # GitHub Pages usa: ele nao depende de o envio ao Cloudflare ter dado certo
      publicar: ${{ steps.ponta.outputs.publicar }}
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: A bateria inteira, pelo tree (nivel 3)
        id: bateria
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RODADA: ${{ github.event.workflow_run.id }}
        run: |
          node _teste/arvore_da_main.js "$COMMIT"
          if grep -q '^reaproveita=sim' "$GITHUB_OUTPUT"; then
            echo "nivel 3: publica sem rodar a bateria de novo (o tree e o de um PR com a bateria inteira verde)"
            echo "liberada=sim" >> "$GITHUB_OUTPUT"
          else
            juntador=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RODADA/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "portao-navegador")][0].conclusion' || echo "")
            echo "nivel 3: o tree difere (ou nao ha PR); portao-navegador nesta rodada do portao: ${juntador:-ausente}"
            if [ "$juntador" = "success" ]; then
              echo "nivel 3: a bateria inteira rodou e passou: publica"
              echo "liberada=sim" >> "$GITHUB_OUTPUT"
            else
              echo "nivel 3: a bateria inteira nao passou nesta rodada: NAO publica"
              echo "liberada=nao" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: O commit do portao ainda e a ponta da main
        id: ponta
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          ponta=$(git rev-parse origin/main)
          echo "portao verde em $COMMIT; ponta da main: $ponta"
          if [ "${{ steps.bateria.outputs.liberada }}" != "sim" ]; then
            echo "a bateria inteira nao esta liberada para este commit (passo anterior)"
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
          elif [ "$ponta" = "$COMMIT" ]; then
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
          else
            echo "a main ja andou: quem publica e o portao do commit mais novo"
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ponta.outputs.publicar == 'sim'
        with:
          node-version: '24.14.1'
      - name: Monta o site
        if: steps.ponta.outputs.publicar == 'sim'
        run: sh .github/monta_site.sh _site
      # O endpoint de IA (functions/api/ia.js) e uma Pages Function: o wrangler,
      # rodando da raiz do repositorio, acha functions/ e empacota o codigo com
      # o SDK da Anthropic. A versao do SDK e exata (functions/package-lock.json).
      # Se o empacotamento falhar, o deploy inteiro falha e o site no ar fica
      # como estava.
      - name: Dependencias do endpoint de IA (functions/)
        if: steps.ponta.outputs.publicar == 'sim'
        run: npm ci --prefix functions --no-audit --no-fund
      - name: Envia ao Cloudflare Pages (producao, ramo main)
        id: envio
        if: steps.ponta.outputs.publicar == 'sim'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.151.3 pages deploy _site \
            --project-name apoio-educacional --branch main \
            --commit-hash "$COMMIT" --commit-message "portao verde em $COMMIT" --commit-dirty=true
          echo "publicou=sim" >> "$GITHUB_OUTPUT"

  conferencia:
    needs: publica
    if: needs.publica.outputs.publicou == 'sim'
    uses: ./.github/workflows/conferencia-no-ar.yml
    with:
      site: https://apoio-educacional.pages.dev
      ref: ${{ github.event.workflow_run.head_sha }}

  # O ENDERECO ANTIGO (romulorod1.github.io), pela MESMA montagem (13f). Ate o
  # 13f o GitHub Pages publicava o repositorio cru (build legacy, a cada push na
  # main, sem esperar o portao). Com VERSAO e CACHE fixos no repositorio, o
  # sw.js de la nunca mudaria, e o tablet que abrisse o endereco antigo nao
  # atualizaria mais. Agora ele sai daqui, com o icone de sempre
  # (--endereco-antigo), quando o passo "ponta" do job publica libera (portao
  # verde e commit na ponta da main), e NAO quando o envio ao Cloudflare da
  # certo: uma falha do wrangler nao pode deixar o endereco antigo parado. O
  # !cancelled() e o que deixa este job rodar com o job publica vermelho no envio.
  # CONDICAO, e nao fato: o Pages do repositorio tem de estar em build_type
  # "workflow" (Actions). O primeiro passo confere e FALHA alto se nao estiver;
  # com "legacy", o deploy-pages nao publicaria e o build legacy seguiria
  # servindo o repositorio cru, com o sw.js fixo. O merge_seguro recusa o PR que
  # mexe neste arquivo com o Pages fora de Actions.
  publica-github-pages:
    needs: publica
    if: ${{ !cancelled() && needs.publica.outputs.publicar == 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.envio-pages.outputs.page_url }}
    steps:
      - name: O Pages do repositorio publica por Actions (build_type workflow)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tipo=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type) || {
            echo "FALHOU  nao consegui ler a configuracao do GitHub Pages"; exit 1; }
          echo "build_type do Pages: $tipo"
          if [ "$tipo" != "workflow" ]; then
            echo "FALHOU  o Pages esta em build_type \"$tipo\": troque o Pages para Actions antes (gh api -X PUT repos/${{ github.repository }}/pages -f build_type=workflow)"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - name: Monta o site do endereco antigo
        run: sh .github/monta_site.sh _site_antigo --endereco-antigo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site_antigo
      - name: Envia ao GitHub Pages
        id: envio-pages
        uses: actions/deploy-pages@v4

  conferencia-antigo:
    needs: publica-github-pages
    uses: ./.github/workflows/conferencia-no-ar.yml
    with:
      site: https://romulorod1.github.io/apoio-educacional
      ref: ${{ github.event.workflow_run.head_sha }}
