# O guarda de merge no CI (item 13c da FILA, aprovado pelo dono em 12/11).
#
# Refaz as conferencias do _teste/merge_seguro.js (bateria inteira verde na
# cabeca, revisao adversarial que cita o sha7 e termina em "veredito: aprova",
# CACHE e VERSAO maiores que os da main, ramo em dia quando o PR e risco) e
# publica o veredito como STATUS de commit, contexto portao-merge, na cabeca
# que julgou. Quem faz o trabalho e o _teste/guarda_merge.sh.
#
# QUANDO RODA, e por que os tres:
#   pull_request   cabeca nova (o veredito antigo nao vale para ela), rotulo
#                  posto ou tirado (o risco muda a regra);
#   issue_comment  a revisao chega como comentario;
#   workflow_run   a bateria (workflow portao) terminou.
# O issue_comment e o workflow_run so rodam com este arquivo NA MAIN, e rodam o
# codigo da main. O pull_request roda o do merge do PR.
#
# NAO E strict: true, e nao exige o portao-navegador (decisao de 09/11: PR sem
# risco entra atras da main; e o juntador pulado conta como aprovado na
# protecao). A exigencia do portao-merge na protecao fica com a orquestradora,
# depois de ver este guarda verde num PR real.
name: guarda-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [portao]
    types: [completed]

# Um veredito por PR por vez, com o MESMO grupo para os tres eventos: o mais
# novo cancela o que estava julgando. Grupos separados deixariam um "failure"
# julgado antes da bateria terminar ser publicado DEPOIS do "success".
concurrency:
  group: guarda-merge-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write

jobs:
  guarda-merge:
    # comentario so de PR; workflow_run so da bateria de PR
    if: >-
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - name: Julga e publica o status portao-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_MERGE_SEGURO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || '' }}
          SHA_DO_EVENTO: ${{ github.event.workflow_run.head_sha || '' }}
          URL_DA_RODADA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: sh _teste/guarda_merge.sh
