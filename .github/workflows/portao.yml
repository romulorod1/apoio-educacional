# O portao de merge no GitHub.
#
# Duas partes, porque o portao inteiro passa de dez minutos e quase todo esse
# tempo e Chrome:
#
#   portao-rapido     todo PR e todo push na main. Roda o confere_tudo.sh com
#                     --rapido: tudo que nao abre navegador (suites Node e
#                     Python, kit de figuras, provas da biblioteca sem Chrome,
#                     trava do nome do cache, serie da matematica, toda prova
#                     no portao, privacidade). O que ele pula sai na saida,
#                     uma linha "pulado" por prova. E o check que a protecao
#                     da main exige.
#   portao-navegador  o portao inteiro, com Chrome. Roda no push na main, quando
#                     alguem pede a mao (workflow_dispatch) e no PR que tiver o
#                     rotulo "navegador". O portao local continua obrigatorio
#                     antes do merge (regra F2); este e a segunda opiniao, numa
#                     maquina limpa, sem servidor esquecido nem cache quente.
#
# AS PROVAS DE NAVEGADOR RODAM EM QUATRO FATIAS PARALELAS. Numa maquina so, uma
# depois da outra, o inteiro passou de oitenta minutos (118 provas em 10/2026,
# e crescendo). Cada fatia e uma maquina do GitHub com `confere_tudo.sh
# --pedaco K/4`; o testa_pedacos_do_portao prova que toda prova cai em
# exatamente uma fatia. O job portao-navegador, com o nome de sempre, so junta:
# fica verde quando as quatro fatias ficam verdes, e e ele que o merge_seguro
# le. Nada disso roda na maquina de quem trabalha.
#
# fetch-depth 0 nas duas: a trava do cache compara com a BASE DO MERGE
# (git merge-base HEAD origin/main), e com o clone raso de um commit so nao ha
# base nenhuma e a trava sairia INSTAVEL em todo PR.
#
# A trava do cache so AFIRMA alguma coisa no PR: ali o HEAD e o commit de
# merge e a base e a ponta da main. No push na main o HEAD e a propria main,
# a base e ele mesmo, e as duas travas do cache dizem ok sem comparar nada.
# Nao e furo, porque o mesmo commit ja passou por elas no PR; mas o ok do
# push na main nao vale como conferencia do cache.
name: portao

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portao-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  portao-rapido:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: origin/main para a base do merge
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Dependencias Python
        run: pip install -r _teste/requirements.txt
      - name: Dependencias Node
        working-directory: _teste
        run: npm ci --no-audit --no-fund
      - name: Portao rapido
        run: sh _teste/confere_tudo.sh --rapido
      - name: Saida de quem reprovou
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: falhas-do-portao-rapido
          path: _falhas_do_portao/
          if-no-files-found: ignore

  portao-navegador-fatia:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'navegador')
    name: portao-navegador (fatia ${{ matrix.fatia }} de 4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # uma fatia vermelha nao derruba as outras: o merge espera todas, e a
      # saida de cada uma e o que diz onde esta o defeito
      fail-fast: false
      matrix:
        fatia: [1, 2, 3, 4]
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: origin/main para a base do merge
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Dependencias Python
        run: pip install -r _teste/requirements.txt
      - name: Dependencias Node
        working-directory: _teste
        run: npm ci --no-audit --no-fund
      - name: Chrome do runner
        run: $CHROME --version
      - name: Fatia do portao inteiro
        run: sh _teste/confere_tudo.sh --pedaco ${{ matrix.fatia }}/4
      - name: Saida de quem reprovou
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: falhas-do-portao-navegador-fatia-${{ matrix.fatia }}
          path: _falhas_do_portao/
          if-no-files-found: ignore

  # O portao inteiro, com o nome que o merge_seguro le: verde so com as quatro
  # fatias verdes. `!cancelled()` para ele rodar e dizer vermelho quando uma
  # fatia falha (sem isso, ele seria pulado, e pulado nao e verde nem vermelho)
  # e ficar cancelado quando a rodada for cancelada; e a mesma condicao das
  # fatias para ele ser pulado onde elas sao puladas.
  portao-navegador:
    if: >-
      !cancelled() && (
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'navegador'))
    needs: portao-navegador-fatia
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: As quatro fatias
        run: |
          echo "resultado das fatias: ${{ needs.portao-navegador-fatia.result }}"
          test "${{ needs.portao-navegador-fatia.result }}" = "success"
