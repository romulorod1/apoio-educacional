# Conferencia pos-deploy: o que esta no ar e o que a main diz?
#
# Merge verde nao prova que a Nathalia recebe o codigo novo: o GitHub Pages
# publica por conta propria, minutos depois, e ja houve release em que o
# tablet seguiu com o cache antigo. Este job abre o site publicado e compara,
# byte a byte (sha256), os arquivos que decidem a atualizacao (sw.js, app.js,
# index.html) com os do commit que acabou de entrar. Imprime a VERSAO do
# app.js e o nome do cache do sw.js que estao no ar.
#
# Espera ate 15 minutos, porque o Pages demora. Se outro push chegar antes, o
# concurrency cancela esta rodada: a conferencia que vale e a do commit mais
# novo, e comparar o site com um commit que ja foi ultrapassado reprovaria
# sem defeito nenhum.
#
# DOIS ENDERECOS DESDE O B4, enquanto o antigo existir, e desde o 13f os dois
# saem da MESMA montagem (.github/monta_site.sh, com VERSAO e CACHE gerados),
# publicada pelo publica-cloudflare.yml depois do portao inteiro verde:
#   novo    https://apoio-educacional.pages.dev, o Cloudflare Pages;
#   antigo  https://romulorod1.github.io/apoio-educacional, o GitHub Pages, que
#           ate o 13f publicava o repositorio cru a cada push na main.
# O publica-cloudflare.yml chama este arquivo (workflow_call) depois de cada
# envio, dizendo o site e o commit. O gatilho de push saiu no 13f: no push,
# nenhum dos dois enderecos ainda tem o commit, e conferir ali reprovaria sem
# defeito. Os dois sao conferidos contra o site MONTADO deste checkout.
# Na mao (workflow_dispatch), escolhe-se qual dos dois.
#
# Quando o GitHub Pages for desligado (virada do B4), saem o job
# publica-github-pages e a linha SITE_ANTIGO; o resto fica.
name: conferencia-no-ar

on:
  workflow_dispatch:
    inputs:
      site:
        description: Endereco a conferir
        type: choice
        default: https://apoio-educacional.pages.dev
        options:
          - https://apoio-educacional.pages.dev
          - https://romulorod1.github.io/apoio-educacional
  workflow_call:
    inputs:
      site:
        type: string
        required: true
      ref:
        type: string
        required: true

# Um grupo por endereco: a conferencia do novo nao cancela a do antigo.
concurrency:
  group: conferencia-no-ar-${{ inputs.site || 'antigo' }}
  cancel-in-progress: true

env:
  SITE_ANTIGO: https://romulorod1.github.io/apoio-educacional

jobs:
  no-ar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth 0: no endereco novo o esperado e o site MONTADO, e a VERSAO e
      # o CACHE saem do contador da publicacao, que le a historia inteira (13f).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - name: O site publicado bate com o commit
        env:
          SITE_PEDIDO: ${{ inputs.site }}
        run: |
          SITE="${SITE_PEDIDO:-$SITE_ANTIGO}"
          echo "conferindo $SITE"
          # Os dois enderecos servem o site montado pelo publica-cloudflare, com
          # VERSAO e CACHE gerados (13f). Os tres arquivos comparados (sw.js,
          # app.js, index.html) sao iguais nas duas montagens; so o icone muda.
          sh _teste/confere_no_ar.sh --montado "$SITE" 900
